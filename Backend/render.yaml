services:
  - type: web
    name: labsphere-ai-backend
    env: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: gunicorn Backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: "*"
